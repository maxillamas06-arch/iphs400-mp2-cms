{% extends "admin/base.html" %}
{% block title %}Borrar publicación{% endblock %}
{% block content %}
  <h1>¿Borrar «{{ post.title }}»?</h1>
  <p>Se borrará para siempre. No se puede deshacer.</p>
  <form method="post" action="{{ url_for('delete_post', post_id=post.id) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token(request) }}">
    <div class="actions">
      <button class="primary danger" type="submit">Sí, borrar</button>
      <a href="{{ url_for('post', post_id=post.id) }}">No, volver</a>
    </div>
  </form>
{% endblock %}
